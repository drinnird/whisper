name: Build ASR runtimes - Windows CUDA 13.2 sm_75

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 150

    steps:
      - name: Install CUDA Toolkit 13.2
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '13.2.0'
          method: 'local'

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Install Ninja and Git
        shell: pwsh
        run: choco install ninja git -y --no-progress

      - name: Clone upstream repositories
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/ggml-org/whisper.cpp.git whisper.cpp
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git llama.cpp
          git clone --depth 1 --recursive https://github.com/mudler/parakeet.cpp.git parakeet.cpp
          "WHISPER_COMMIT=$(git -C whisper.cpp rev-parse HEAD)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "LLAMA_COMMIT=$(git -C llama.cpp rev-parse HEAD)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "PARAKEET_COMMIT=$(git -C parakeet.cpp rev-parse HEAD)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify CUDA
        shell: pwsh
        run: |
          Write-Host "CUDA_PATH=$env:CUDA_PATH"
          & "$env:CUDA_PATH\bin\nvcc.exe" --version
          cmake --version
          ninja --version

      - name: Configure whisper.cpp
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake -S whisper.cpp -B build-whisper -G "Ninja Multi-Config" ^
            -DGGML_CUDA=ON ^
            -DGGML_CUDA_FORCE_MMQ=ON ^
            -DGGML_NATIVE=OFF ^
            -DCMAKE_CUDA_ARCHITECTURES=75 ^
            -DCMAKE_CUDA_COMPILER="%CUDA_PATH%\bin\nvcc.exe"

      - name: Build Whisper and Parakeet 0.6B runtimes
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake --build build-whisper --config Release --parallel %NUMBER_OF_PROCESSORS% --target whisper-cli parakeet-cli

      - name: Configure parakeet.cpp 1.1B runtime
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake -S parakeet.cpp -B build-parakeet -G "Ninja Multi-Config" ^
            -DPARAKEET_BUILD_CLI=ON ^
            -DPARAKEET_BUILD_TESTS=OFF ^
            -DPARAKEET_GGML_CUDA=ON ^
            -DGGML_CUDA_FORCE_MMQ=ON ^
            -DGGML_NATIVE=OFF ^
            -DCMAKE_CUDA_ARCHITECTURES=75 ^
            -DCMAKE_CUDA_COMPILER="%CUDA_PATH%\bin\nvcc.exe"

      - name: Build Parakeet 1.1B runtime
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake --build build-parakeet --config Release --parallel %NUMBER_OF_PROCESSORS% --target parakeet-cli

      - name: Configure llama.cpp
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake -S llama.cpp -B build-llama -G "Ninja Multi-Config" ^
            -DGGML_CUDA=ON ^
            -DGGML_CUDA_FORCE_MMQ=ON ^
            -DGGML_NATIVE=OFF ^
            -DCMAKE_CUDA_ARCHITECTURES=75 ^
            -DCMAKE_CUDA_COMPILER="%CUDA_PATH%\bin\nvcc.exe"

      - name: Build Qwen multimodal runtime
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake --build build-llama --config Release --parallel %NUMBER_OF_PROCESSORS% --target llama-mtmd-cli

      - name: Package runtimes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist\whispercpp, dist\parakeetcpp, dist\llamacpp | Out-Null

          $wbin = Join-Path $env:GITHUB_WORKSPACE 'build-whisper\bin\Release'
          $lbin = Join-Path $env:GITHUB_WORKSPACE 'build-llama\bin\Release'
          if (-not (Test-Path "$wbin\whisper-cli.exe")) { throw 'whisper-cli.exe missing' }
          if (-not (Test-Path "$wbin\parakeet-cli.exe")) { throw 'whisper.cpp parakeet-cli.exe missing' }
          if (-not (Test-Path "$lbin\llama-mtmd-cli.exe")) { throw 'llama-mtmd-cli.exe missing' }

          Get-ChildItem $wbin -File | Where-Object { $_.Extension -in '.exe','.dll' } | Copy-Item -Destination dist\whispercpp
          Get-ChildItem $lbin -File | Where-Object { $_.Extension -in '.exe','.dll' } | Copy-Item -Destination dist\llamacpp

          $pkCandidates = @(Get-ChildItem "$env:GITHUB_WORKSPACE\build-parakeet" -Filter parakeet-cli.exe -File -Recurse |
            Where-Object { $_.FullName -match '\\Release\\|examples\\cli' })
          if ($pkCandidates.Count -eq 0) { throw 'parakeet.cpp parakeet-cli.exe missing' }
          if ($pkCandidates.Count -ne 1) {
            $candidateList = ($pkCandidates | ForEach-Object { $_.FullName }) -join [Environment]::NewLine
            throw "Expected exactly one parakeet.cpp parakeet-cli.exe, found $($pkCandidates.Count):$([Environment]::NewLine)$candidateList"
          }
          $pkExe = $pkCandidates[0]
          Copy-Item $pkExe.FullName -Destination 'dist\parakeetcpp\parakeet11-cli.exe'
          Get-ChildItem "$env:GITHUB_WORKSPACE\build-parakeet" -Filter *.dll -File -Recurse |
            Where-Object { $_.FullName -match '\\Release\\|bin' } |
            ForEach-Object { Copy-Item $_.FullName -Destination 'dist\parakeetcpp' -Force }

          @"
          Windows CUDA 13.2 / sm_75 ASR runtimes
          ======================================
          whisper.cpp commit:  $env:WHISPER_COMMIT
          parakeet.cpp commit: $env:PARAKEET_COMMIT
          llama.cpp commit:    $env:LLAMA_COMMIT
          CUDA architecture:   75 (GTX 1650 / Turing)
          GGML_CUDA_FORCE_MMQ:  ON

          dist\whispercpp contains whisper-cli.exe and whisper.cpp parakeet-cli.exe (0.6B v3).
          dist\parakeetcpp contains parakeet11-cli.exe (parakeet.cpp, supports 1.1B families).
          dist\llamacpp contains llama-mtmd-cli.exe.
          Keep each executable beside the DLLs from its own folder.
          "@ | Set-Content -Encoding UTF8 dist\BUILD_INFO.txt

          Compress-Archive -Path dist\* -DestinationPath ASR-CUDA132-sm75-runtimes.zip -Force

      - name: Smoke test help commands
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PATH = "$env:CUDA_PATH\bin;$env:PATH"

          function Invoke-RuntimeHelpTest {
            param([Parameter(Mandatory=$true)][string]$ExePath)
            if (-not (Test-Path -LiteralPath $ExePath -PathType Leaf)) {
              throw "Runtime executable is missing: $ExePath"
            }
            Write-Host "Smoke testing $ExePath --help"
            & $ExePath --help
            $exitCode = $LASTEXITCODE
            if ($exitCode -ne 0) {
              throw "Runtime help smoke test failed with exit code ${exitCode}: $ExePath"
            }
          }

          Invoke-RuntimeHelpTest '.\dist\whispercpp\whisper-cli.exe'
          Invoke-RuntimeHelpTest '.\dist\whispercpp\parakeet-cli.exe'
          Invoke-RuntimeHelpTest '.\dist\parakeetcpp\parakeet11-cli.exe'
          Invoke-RuntimeHelpTest '.\dist\llamacpp\llama-mtmd-cli.exe'

      - name: Upload runtimes
        uses: actions/upload-artifact@v4
        with:
          name: ASR-CUDA132-sm75-runtimes
          path: ASR-CUDA132-sm75-runtimes.zip
          if-no-files-found: error
          retention-days: 30
