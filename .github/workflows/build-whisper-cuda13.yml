name: Build whisper.cpp - Windows CUDA 13.2 sm_75

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-cuda132:
    name: Windows x64 CUDA 13.2 GTX 1650
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout current whisper.cpp
        uses: actions/checkout@v4
        with:
          repository: ggml-org/whisper.cpp
          ref: master
          path: whisper.cpp
          fetch-depth: 1

      - name: Install CUDA Toolkit 13.2
        uses: Jimver/cuda-toolkit@v0.2.36
        id: cuda
        with:
          cuda: '13.2.0'
          method: 'local'

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Install Ninja
        shell: pwsh
        run: choco install ninja -y --no-progress

      - name: Verify build environment
        shell: pwsh
        run: |
          Write-Host "CUDA_PATH=$env:CUDA_PATH"
          & "$env:CUDA_PATH\bin\nvcc.exe" --version
          cmake --version
          ninja --version

      - name: Record whisper.cpp commit
        shell: pwsh
        run: |
          Set-Location whisper.cpp
          $commit = git rev-parse HEAD
          $date = git show -s --format=%cI HEAD
          Set-Location ..
          "WHISPER_CPP_COMMIT=$commit" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "WHISPER_CPP_COMMIT_DATE=$date" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Building whisper.cpp commit $commit"

      - name: Configure CUDA 13.2 build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake -S whisper.cpp -B build -G "Ninja Multi-Config" ^
            -DGGML_CUDA=ON ^
            -DCMAKE_CUDA_ARCHITECTURES=75 ^
            -DGGML_NATIVE=OFF ^
            -DWHISPER_SDL2=OFF ^
            -DCMAKE_CUDA_COMPILER="%CUDA_PATH%\bin\nvcc.exe"

      - name: Build Release
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake --build build --config Release --parallel %NUMBER_OF_PROCESSORS%

      - name: Prepare distributable package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $src = Join-Path $env:GITHUB_WORKSPACE "build\bin\Release"
          $dist = Join-Path $env:GITHUB_WORKSPACE "dist"

          if (-not (Test-Path (Join-Path $src "whisper-cli.exe"))) {
              Write-Host "Contents of build/bin:"
              Get-ChildItem "$env:GITHUB_WORKSPACE\build\bin" -Recurse | Select-Object FullName
              throw "whisper-cli.exe was not found in build\bin\Release"
          }

          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          # Copy whisper.cpp executables and its own runtime DLLs.
          Get-ChildItem $src -File |
            Where-Object { $_.Extension -in ".exe", ".dll" } |
            Copy-Item -Destination $dist

          @"
          @echo off
          setlocal
          set "CUDA132=C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.2\bin"
          if exist "%CUDA132%\cudart64_13.dll" (
              set "PATH=%CUDA132%;%PATH%"
          )
          "%~dp0whisper-cli.exe" %*
          "@ | Set-Content -Encoding ASCII (Join-Path $dist "whisper-cli-cuda132.bat")

          @"
          whisper.cpp Windows CUDA build
          =================================
          CUDA Toolkit used to compile: 13.2.0
          CUDA architecture: sm_75 / compute capability 7.5
          Target GPU: NVIDIA GeForce GTX 1650
          whisper.cpp commit: $env:WHISPER_CPP_COMMIT
          whisper.cpp commit date: $env:WHISPER_CPP_COMMIT_DATE

          This package intentionally does not bundle the NVIDIA CUDA Toolkit.
          The target PC should have CUDA 13.2 runtime/toolkit libraries available.
          The included whisper-cli-cuda132.bat prepends the normal CUDA 13.2 bin
          directory to PATH before launching whisper-cli.exe.

          Basic use:
            whisper-cli-cuda132.bat -m C:\path\ggml-small.en.bin -f C:\path\audio.wav

          whisper-cli expects compatible audio input; see upstream whisper.cpp docs.
          "@ | Set-Content -Encoding UTF8 (Join-Path $dist "BUILD_INFO.txt")

          Compress-Archive -Path "$dist\*" `
            -DestinationPath "$env:GITHUB_WORKSPACE\whisper-cpp-windows-cuda132-sm75.zip" `
            -Force

          Get-ChildItem $dist | Format-Table Name, Length

      - name: Smoke test CLI
        shell: pwsh
        continue-on-error: true
        run: |
          $env:PATH = "$env:CUDA_PATH\bin;$env:PATH"
          & ".\dist\whisper-cli.exe" --help

      - name: Upload CUDA 13.2 binary
        uses: actions/upload-artifact@v4
        with:
          name: whisper-cpp-windows-cuda132-sm75
          path: whisper-cpp-windows-cuda132-sm75.zip
          if-no-files-found: error
          retention-days: 30
