name: Build ASR runtimes - Windows CUDA 13.2 sm_75

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Install CUDA Toolkit 13.2
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '13.2.0'
          method: 'local'

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Install Ninja and Git
        shell: pwsh
        run: choco install ninja git -y --no-progress

      - name: Clone upstream repositories
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/ggml-org/whisper.cpp.git whisper.cpp
          git clone --depth 1 --recursive https://github.com/mudler/parakeet.cpp.git parakeet.cpp
          "WHISPER_COMMIT=$(git -C whisper.cpp rev-parse HEAD)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "PARAKEET_COMMIT=$(git -C parakeet.cpp rev-parse HEAD)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify CUDA
        shell: pwsh
        run: |
          Write-Host "CUDA_PATH=$env:CUDA_PATH"
          & "$env:CUDA_PATH\bin\nvcc.exe" --version
          cmake --version
          ninja --version

      - name: Configure whisper.cpp
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake -S whisper.cpp -B build-whisper -G "Ninja Multi-Config" ^
            -DGGML_CUDA=ON ^
            -DGGML_CUDA_FORCE_MMQ=ON ^
            -DGGML_NATIVE=OFF ^
            -DCMAKE_CUDA_ARCHITECTURES=75 ^
            -DCMAKE_CUDA_COMPILER="%CUDA_PATH%\bin\nvcc.exe"

      - name: Build Whisper and Parakeet 0.6B runtimes
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake --build build-whisper --config Release --parallel %NUMBER_OF_PROCESSORS% --target whisper-cli parakeet-cli

      - name: Configure parakeet.cpp 1.1B runtime
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake -S parakeet.cpp -B build-parakeet -G "Ninja Multi-Config" ^
            -DPARAKEET_BUILD_CLI=ON ^
            -DPARAKEET_BUILD_TESTS=OFF ^
            -DPARAKEET_GGML_CUDA=ON ^
            -DGGML_CUDA_FORCE_MMQ=ON ^
            -DGGML_NATIVE=OFF ^
            -DCMAKE_CUDA_ARCHITECTURES=75 ^
            -DCMAKE_CUDA_COMPILER="%CUDA_PATH%\bin\nvcc.exe"

      - name: Build Parakeet 1.1B runtime
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake --build build-parakeet --config Release --parallel %NUMBER_OF_PROCESSORS% --target parakeet-cli

      - name: Package runtimes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist\whispercpp, dist\parakeetcpp | Out-Null

          $wbin = Join-Path $env:GITHUB_WORKSPACE 'build-whisper\bin\Release'
          $pbin = Join-Path $env:GITHUB_WORKSPACE 'build-parakeet\bin\Release'
          if (-not (Test-Path "$wbin\whisper-cli.exe")) { throw 'whisper-cli.exe missing' }
          if (-not (Test-Path "$wbin\parakeet-cli.exe")) { throw 'whisper.cpp parakeet-cli.exe missing' }

          Get-ChildItem $wbin -File | Where-Object { $_.Extension -in '.exe','.dll' } | Copy-Item -Destination dist\whispercpp

          $pkCandidates = @(Get-ChildItem "$env:GITHUB_WORKSPACE\build-parakeet" -Filter parakeet-cli.exe -File -Recurse |
            Where-Object { $_.FullName -match '\\Release\\|examples\\cli' })
          if ($pkCandidates.Count -eq 0) { throw 'parakeet.cpp parakeet-cli.exe missing' }
          if ($pkCandidates.Count -ne 1) {
            $candidateList = ($pkCandidates | ForEach-Object { $_.FullName }) -join [Environment]::NewLine
            throw "Expected exactly one parakeet.cpp parakeet-cli.exe, found $($pkCandidates.Count):$([Environment]::NewLine)$candidateList"
          }
          $pkExe = $pkCandidates[0]
          Copy-Item $pkExe.FullName -Destination 'dist\parakeetcpp\parakeet11-cli.exe'
          Get-ChildItem "$env:GITHUB_WORKSPACE\build-parakeet" -Filter *.dll -File -Recurse |
            Where-Object { $_.FullName -match '\\Release\\|bin' } |
            ForEach-Object { Copy-Item $_.FullName -Destination 'dist\parakeetcpp' -Force }

          # Build an app-local dependency closure for the runtimes compiled in this workflow.
          # Qwen/llama.cpp is intentionally external and is not built or packaged here.
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) { throw "vswhere.exe not found: $vswhere" }
          $vsInstall = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1)
          if (-not $vsInstall) { throw 'Visual Studio C++ installation path could not be resolved' }
          $dumpbin = Get-ChildItem (Join-Path $vsInstall 'VC\Tools\MSVC') -Filter dumpbin.exe -File -Recurse |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin.exe could not be resolved from Visual Studio' }

          $vcRedistRoot = Join-Path $vsInstall 'VC\Redist\MSVC'
          $vcRuntimeDirs = @()
          if (Test-Path -LiteralPath $vcRedistRoot -PathType Container) {
            $latestRedist = Get-ChildItem $vcRedistRoot -Directory | Sort-Object Name -Descending | Select-Object -First 1
            if ($latestRedist) {
              $vcRuntimeDirs = @(Get-ChildItem $latestRedist.FullName -Directory -Recurse |
                Where-Object { $_.FullName -match '\\x64\\' } |
                Select-Object -ExpandProperty FullName)
            }
          }

          $cudaRuntimeDirs = @(
            (Join-Path $env:CUDA_PATH 'bin'),
            (Join-Path $env:CUDA_PATH 'bin\x64')
          ) | Where-Object { Test-Path -LiteralPath $_ -PathType Container }

          function Get-DependentDllNames {
            param([Parameter(Mandatory=$true)][string]$BinaryPath)
            $output = & $dumpbin.FullName /DEPENDENTS $BinaryPath 2>&1
            if ($LASTEXITCODE -ne 0) {
              throw "dumpbin /DEPENDENTS failed for ${BinaryPath}: exit code $LASTEXITCODE`n$($output -join [Environment]::NewLine)"
            }
            @($output | ForEach-Object {
              if ($_ -match '^\s+([A-Za-z0-9_.+\-]+\.dll)\s*$') { $matches[1] }
            } | Sort-Object -Unique)
          }

          function Resolve-DependencyPath {
            param(
              [Parameter(Mandatory=$true)][string]$DllName,
              [Parameter(Mandatory=$true)][string[]]$SearchDirs
            )
            foreach ($dir in $SearchDirs) {
              if (-not $dir) { continue }
              $candidate = Join-Path $dir $DllName
              if (Test-Path -LiteralPath $candidate -PathType Leaf) { return $candidate }
            }
            return $null
          }

          function Test-WindowsApiSetName {
            param([Parameter(Mandatory=$true)][string]$DllName)
            return ($DllName -match '^(api|ext)-ms-win-.*\.dll$')
          }

          function Add-RuntimeDependencyClosure {
            param(
              [Parameter(Mandatory=$true)][string]$Destination,
              [Parameter(Mandatory=$true)][string[]]$BuildDirs
            )
            $destPath = (Resolve-Path $Destination).Path
            $searchDirs = @($destPath) + @($BuildDirs) + @($cudaRuntimeDirs) + @($vcRuntimeDirs)
            $queue = [System.Collections.Generic.Queue[string]]::new()
            Get-ChildItem $destPath -File | Where-Object { $_.Extension -in '.exe','.dll' } | ForEach-Object { $queue.Enqueue($_.FullName) }
            $visited = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
            $unresolved = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
            $copied = [System.Collections.Generic.List[string]]::new()

            while ($queue.Count -gt 0) {
              $binary = $queue.Dequeue()
              if (-not $visited.Add($binary)) { continue }
              foreach ($dep in (Get-DependentDllNames -BinaryPath $binary)) {
                $local = Join-Path $destPath $dep
                if (Test-Path -LiteralPath $local -PathType Leaf) {
                  if ($visited.Add($local)) {
                    $visited.Remove($local) | Out-Null
                    $queue.Enqueue($local)
                  }
                  continue
                }

                $resolved = Resolve-DependencyPath -DllName $dep -SearchDirs $searchDirs
                if ($resolved) {
                  Copy-Item -LiteralPath $resolved -Destination $local -Force
                  $copied.Add("$dep <= $resolved") | Out-Null
                  $queue.Enqueue($local)
                  continue
                }

                if (Test-WindowsApiSetName -DllName $dep) { continue }
                $systemDll = Join-Path $env:SystemRoot "System32\$dep"
                if (Test-Path -LiteralPath $systemDll -PathType Leaf) { continue }
                $unresolved.Add($dep) | Out-Null
              }
            }

            $report = @(
              "Runtime directory: $destPath",
              "dumpbin: $($dumpbin.FullName)",
              '',
              'App-local files:'
            ) + @(Get-ChildItem $destPath -File | Sort-Object Name | ForEach-Object { "  $($_.Name)" }) + @(
              '',
              'Dependencies copied by closure:'
            ) + @($copied | Sort-Object | ForEach-Object { "  $_" }) + @(
              '',
              'Unresolved non-system dependencies:'
            ) + @($unresolved | Sort-Object | ForEach-Object { "  $_" })
            $report | Set-Content -Encoding UTF8 (Join-Path $destPath 'DEPENDENCIES.txt')

            if ($unresolved.Count -gt 0) {
              throw "Unresolved non-system DLL dependencies in ${Destination}: $(@($unresolved) -join ', ')"
            }
          }

          Add-RuntimeDependencyClosure -Destination 'dist\whispercpp' -BuildDirs @($wbin)
          Add-RuntimeDependencyClosure -Destination 'dist\parakeetcpp' -BuildDirs @($pbin, $pkExe.DirectoryName)

          @"
          Windows CUDA 13.2 / sm_75 ASR runtimes
          ======================================
          whisper.cpp commit:  $env:WHISPER_COMMIT
          parakeet.cpp commit: $env:PARAKEET_COMMIT
          CUDA architecture:   75 (GTX 1650 / Turing)
          GGML_CUDA_FORCE_MMQ:  ON

          dist\whispercpp contains whisper-cli.exe and whisper.cpp parakeet-cli.exe (0.6B v3).
          dist\parakeetcpp contains parakeet11-cli.exe (parakeet.cpp, supports 1.1B families).
          Qwen3-ASR is intentionally not built here. Install a complete official llama.cpp Windows release under package\bin\llamacpp\.
          Each built runtime directory contains DEPENDENCIES.txt with the dependency closure report.
          Keep each executable beside the DLLs from its own runtime distribution.
          "@ | Set-Content -Encoding UTF8 dist\BUILD_INFO.txt

          Compress-Archive -Path dist\* -DestinationPath ASR-CUDA132-sm75-runtimes.zip -Force

      - name: Smoke test help commands
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PATH = "$env:CUDA_PATH\bin;$env:CUDA_PATH\bin\x64;$env:PATH"

          function Invoke-RuntimeHelpTest {
            param([Parameter(Mandatory=$true)][string]$ExePath)
            if (-not (Test-Path -LiteralPath $ExePath -PathType Leaf)) {
              throw "Runtime executable is missing: $ExePath"
            }
            Write-Host "Smoke testing $ExePath --help"
            & $ExePath --help
            $exitCode = $LASTEXITCODE
            if ($exitCode -ne 0) {
              $runtimeDir = Split-Path -Parent $ExePath
              Write-Host "Runtime directory contents:" -ForegroundColor Yellow
              Get-ChildItem $runtimeDir -File | Sort-Object Name | ForEach-Object { Write-Host "  $($_.Name)" }
              $dependencyReport = Join-Path $runtimeDir 'DEPENDENCIES.txt'
              if (Test-Path -LiteralPath $dependencyReport -PathType Leaf) {
                Write-Host "Dependency report:" -ForegroundColor Yellow
                Get-Content -LiteralPath $dependencyReport | ForEach-Object { Write-Host $_ }
              }
              $unsignedExit = [uint32]([int64]$exitCode -band 0xFFFFFFFFL)
              $hexExit = ('0x{0:X8}' -f $unsignedExit)
              throw "Runtime help smoke test failed with exit code ${exitCode} (${hexExit}): $ExePath"
            }
          }

          Invoke-RuntimeHelpTest '.\dist\whispercpp\whisper-cli.exe'
          Invoke-RuntimeHelpTest '.\dist\whispercpp\parakeet-cli.exe'
          Invoke-RuntimeHelpTest '.\dist\parakeetcpp\parakeet11-cli.exe'

      - name: Upload runtimes
        uses: actions/upload-artifact@v4
        with:
          name: ASR-CUDA132-sm75-runtimes
          path: ASR-CUDA132-sm75-runtimes.zip
          if-no-files-found: error
          retention-days: 30
